# Constant lever arms [m] in body frame B (not optimized).
# body_convention: FRD (x forward, y right, z down) for DJI M3E default.

body_convention: "FRD"

L_B_to_A: [0.12, 0.05, -0.58]   # RTK antenna phase center in B
L_B_to_G: [0.00, 0.00, -0.55]    # reflective sphere center in B

L_G_to_M:
  0: [0.10, 0.00, 0.00]
  1: [-0.033, 0.094, 0.00]
  2: [-0.033, -0.047, 0.082]
  3: [-0.033, -0.047, -0.082]
