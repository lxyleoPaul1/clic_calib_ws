# §4.3–§4.4 calibration target geometry
sphere_radius_m: 0.10
reflectivity_min: 0.5
apriltag_size_m: 0.05
apriltag_family: tag36h11

# Corner offsets in marker frame M (meters), order TL, TR, BR, BL per tag id.
apriltag_corners_in_marker_frame:
  0:
    - [-0.025, -0.025, 0.0]
    - [0.025, -0.025, 0.0]
    - [0.025, 0.025, 0.0]
    - [-0.025, 0.025, 0.0]
  1:
    - [-0.025, -0.025, 0.0]
    - [0.025, -0.025, 0.0]
    - [0.025, 0.025, 0.0]
    - [-0.025, 0.025, 0.0]
